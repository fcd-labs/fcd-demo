# Jouw FCD-model: FCD-Demo, de way of working ("fabriek") die ShowKitchen voortbrengt
# Bron: fcd-mvp0.md, fcd-showcases.md, fcd-objecten.md
# Kopie uit fcd/fcd/fcd-demo.fcd.yaml (20 november 2026), aangevuld met de configuratie van de showcase:
# Pipeline (vastgelegde versie, trigger, uitrol, release, stappen), Step, QualityGate (drempels), Dashboard,
# Environment (poorten) en goedgekeurde afwijkingen op een gate. Pipeline en Dashboard lezen dit bestand.
# Objecten volgen fcd-objecten.md. De veldnamen zijn een voorstel.
# Wat niet in de bronnen staat, staat hier niet. De plaat toont dat als gat.
---
apiVersion: fcd/v0
kind: Factory
metadata:
  name: fcd-demo
  title: FCD-Demo
spec:
  description: De eerste, kleinste way of working die de hele cirkel rond gaat. AI als versneller.
  showcase: demo
  experiment: mvp0
  product: showkitchen
  intentParts:
    - Persona en userstory
    - Waarom (objective)
    - Meten (key result)
    - Gedrag als scenario's
  subProductDescriptionParts:
    - Verantwoordelijkheid
    - Gebruikers
    - Interfaces
    - Intents
---
apiVersion: fcd/v0
kind: Group
metadata:
  name: claude-code
  title: Claude Code met agents
spec:
  type: squad
  composition: ai-agents-only
  owner: product owner
---
apiVersion: fcd/v0
kind: Pipeline
metadata:
  name: pipeline
  title: Pipeline
spec:
  uses: {subProduct: fcd-pipeline, version: 0.7.0}
  builds: true
  deploys: true
  calledBy: Pipeline-agent
  # Bron: een lokale git-server (bare repositories in ~/.fcd/git). Tijdens de demo geen push naar remote (V9).
  source: local-git
  # Goedkeuring bij de start: de product owner drukt op de knop op het Dashboard (V3). Alleen wat gemerged is.
  trigger: dashboard-button
  artifact: container
  deployUnit: SubProduct
  deployTarget: docker-compose
  # Lokale tag, de tekst uit de changelog; geen GitHub Release in de demo (V9).
  release: {tag: "v{version}", githubRelease: false, notesFrom: CHANGELOG.md}
  # De demo herhalen (V10): ./fcd demo reset zet de lokale git terug naar startTag; branches zijn de klaarstaande wijzigingen.
  demo: {startTag: demo-start, branches: ["patch/*"], warm: true}   # warm: de klaarstaande branches vooraf bouwen (EXP-004)
  steps: [static-check, unit-tests, contract-test, build, integration-tests, security-freshness, sbom-licenses, deploy, end-to-end-tests, release]
  # Nog niet gebouwd (grow through doing): grijs op het Dashboard, nooit uitgevoerd. Issues in fcd-demo.
  backlog: [eslint, coverage, consumer-contract-test, dast, performance-tests]
---
apiVersion: fcd/v0
kind: Dashboard
metadata: {name: dashboard, title: Dashboard}
spec:
  uses: {subProduct: fcd-dashboard, version: 0.5.0}
  # Live weergave van de pipeline (besluit Johannes, 21 november 2026). Het FCD-model kent spec.live nog niet (issue in fcd).
  # De stappen, gates en hun volgorde komen uit Pipeline, Step en QualityGate hierboven; niet herhalen.
  live:
    subProducts: []                   # welke deelproducten, in deze volgorde; leeg is alle
    environments: [lokaal]            # welke runs: lokaal (na een merge); werkplek (vóór een push) niet, zodat een hook-run nooit in de demo verschijnt
    layout: stacked                   # stacked (onder elkaar) of side-by-side
    keepFinishedSeconds: 600          # zo lang blijft een afgelopen run groot staan
    presentation:
      title: "Showcase Demo – live"
      theme: dark
      fontScale: 1.6
      focusRunning: true              # het lopende deelproduct bovenaan
---
apiVersion: fcd/v0
kind: Registry
metadata: {name: registry, title: API-register}
spec:
  tool: apicurio-registry
  storage: in-memory          # afwijking EXP-003; de contracten staan in git, de Pipeline vult het register opnieuw
---
apiVersion: fcd/v0
kind: Contract
metadata: {name: order, title: De bestelling}
spec:
  repository: sk-bestellen
  file: contracts/order.openapi.yaml
  type: OPENAPI
  between: {from: bestellen, to: [stub-keuken, stub-bar, stub-kassa]}
  container: bestellen-backend   # de contracttest van deze container
  compatibility: BACKWARD
---
apiVersion: fcd/v0
kind: Contract
metadata: {name: bestellen-api, title: Frontend en backend van Bestellen}
spec:
  repository: sk-bestellen
  file: bestellen/contracts/bestellen-api.openapi.yaml
  type: OPENAPI
  between: {from: bestellen-frontend, to: [bestellen-backend]}
  container: bestellen-backend   # de aanbieder; de consumer-kant (frontend) is backlog
  compatibility: BACKWARD
---
apiVersion: fcd/v0
kind: Contract
metadata: {name: logline, title: De logregel}
spec:
  repository: fcd-dashboard
  file: contracts/logline.schema.json
  type: JSON
  between: {from: [pipeline, bestellen], to: [dashboard]}
  compatibility: BACKWARD
---
apiVersion: fcd/v0
kind: Contract
metadata: {name: logline-api, title: Het eindpunt voor logregels}
spec:
  repository: fcd-dashboard
  file: contracts/logline.openapi.yaml
  type: OPENAPI
  compatibility: BACKWARD
  references:
    - {name: ./logline.schema.json, contract: logline}
---
apiVersion: fcd/v0
kind: Contract
metadata: {name: dashboard-api, title: Frontend en backend van het Dashboard}
spec:
  repository: fcd-dashboard
  file: contracts/dashboard-api.openapi.yaml
  type: OPENAPI
  compatibility: BACKWARD
---
apiVersion: fcd/v0
kind: Step
metadata: {name: static-check, title: Statische controle}
spec: {gate: code, level: container}
---
apiVersion: fcd/v0
kind: Step
metadata: {name: unit-tests, title: Unittests}
spec: {gate: code, testType: unit, level: container}
---
apiVersion: fcd/v0
kind: Step
metadata: {name: contract-test, title: Contracttest}
spec: {gate: code, level: container}
---
apiVersion: fcd/v0
kind: Step
metadata: {name: build, title: Bouwen}
# Ingekort voor de demo: de images zijn vooraf opgewarmd (laagcache van docker).
spec: {gate: build, level: container, shortened: EXP-004}
---
apiVersion: fcd/v0
kind: Step
metadata: {name: integration-tests, title: Integratietests}
spec:
  gate: build
  testType: integration
  contractChecks: [not_a_server_error, status_code_conformance, content_type_conformance, response_schema_conformance, response_headers_conformance, negative_data_rejection]
  maxExamples: 25
---
apiVersion: fcd/v0
kind: Step
metadata: {name: security-freshness, title: Security en versheid}
# Ingekort voor de demo: dezelfde scan van dezelfde inhoud (repository of image) komt uit de cache van de voorbereiding.
spec: {gate: security, cache: true, shortened: EXP-005}
---
apiVersion: fcd/v0
kind: Step
metadata: {name: sbom-licenses, title: SBOM en licenties}
spec: {gate: security, sbomFormat: cyclonedx-json, cache: true, shortened: EXP-005}
---
apiVersion: fcd/v0
kind: Step
metadata: {name: deploy, title: Deployen}
spec: {gate: deploy}
---
apiVersion: fcd/v0
kind: Step
metadata: {name: end-to-end-tests, title: End-to-end tests}
# Ingekort voor de demo: alleen het kernpad "bestelling plaatsen".
spec: {gate: deploy, testType: end-to-end, grep: "@kernpad", shortened: EXP-006}
---
apiVersion: fcd/v0
kind: Step
metadata: {name: release, title: Releasen}
# Ingekort voor de demo: een lokale tag en de changelog, geen GitHub Release (geen push naar remote).
spec: {gate: human, shortened: EXP-007}
---
apiVersion: fcd/v0
kind: Step
metadata: {name: eslint, title: ESLint}
spec: {status: backlog, after: static-check, level: container, issue: "fcd-demo#7"}
---
apiVersion: fcd/v0
kind: Step
metadata: {name: coverage, title: Testdekking}
spec: {status: backlog, after: unit-tests, level: container, issue: "fcd-demo#11"}
---
apiVersion: fcd/v0
kind: Step
metadata: {name: consumer-contract-test, title: Consumer-contracttest}
spec: {status: backlog, after: contract-test, level: container}
---
apiVersion: fcd/v0
kind: Step
metadata: {name: dast, title: DAST}
spec: {status: backlog, after: end-to-end-tests}
---
apiVersion: fcd/v0
kind: Step
metadata: {name: performance-tests, title: Performancetests}
spec: {status: backlog, after: end-to-end-tests}
---
apiVersion: fcd/v0
kind: QualityGate
metadata: {name: code, title: Codegate}
spec:
  afterSteps: [static-check, unit-tests, contract-test]
  thresholds:
    lintErrors: {max: 0}
    unitTestsFailed: {max: 0}
    contractLintErrors: {max: 0}
    breakingChanges: {withoutNewMajor: 0}
    versionsConsistent: true
---
apiVersion: fcd/v0
kind: QualityGate
metadata: {name: build, title: Bouwgate}
spec:
  afterSteps: [build, integration-tests]
  thresholds:
    integrationTestsFailed: {max: 0}
---
apiVersion: fcd/v0
kind: QualityGate
metadata: {name: security, title: Securitygate}
spec:
  afterSteps: [security-freshness, sbom-licenses]
  thresholds:
    vulnerabilities: {severities: [CRITICAL, HIGH], onlyWithFix: true, max: 0}
    secrets: {max: 0}
    misconfigurations: {severities: [CRITICAL, HIGH], max: 0}
    freshness: {maxMajorBehind: 1, undetermined: warn}   # besluit Johannes 21-11-2026: hoogstens één major achter
    licenses:
      allowed: [MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Zlib, MPL-2.0, EPL-1.0, EPL-2.0, LGPL-2.0, LGPL-2.1, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0, LGPL-3.0-only, LGPL-3.0-or-later, Unlicense, CC0-1.0, 0BSD]
      restricted: [GPL-1.0, GPL-2.0, GPL-2.0-only, GPL-2.0-or-later, GPL-2.0-with-classpath-exception, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later]
      restrictedInBaseImage: allowed
      forbidden: [AGPL-1.0, AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0, BUSL-1.1, CC-BY-NC-4.0, Commons-Clause]
      unknown: closed
---
apiVersion: fcd/v0
kind: QualityGate
metadata: {name: deploy, title: Uitrolgate}
spec:
  afterSteps: [deploy, end-to-end-tests]
  thresholds:
    readySeconds: {max: 60}
    endToEndTestsFailed: {max: 0}
---
apiVersion: fcd/v0
kind: QualityGate
metadata: {name: human, title: Goedkeuring}
spec:
  # Twee keer de knop op het Dashboard: bij de start en vóór het releasen (besluit Johannes, 21 november 2026).
  beforeSteps: [static-check, release]
  approval: dashboard-button
  approver: Johannes
  principle: human-approves
---
apiVersion: fcd/v0
kind: TestType
metadata: {name: unit, title: Unittests}
---
apiVersion: fcd/v0
kind: TestType
metadata: {name: integration, title: Integratietests binnen het deelproduct}
---
apiVersion: fcd/v0
kind: TestType
metadata: {name: end-to-end, title: End-to-end tests met Playwright}
---
apiVersion: fcd/v0
kind: Environment
metadata: {name: demo, title: één omgeving}
spec:
  composeProjectPrefix: demo
  ports: {dashboard: 8070, registry: 8071, registry-ui: 8072, bestellen: 8080, stub-kitchen: 8091, stub-bar: 8092, stub-cash-register: 8093}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: human-approves}
spec: {statement: "Een mens keurt afwijkingen goed.", explainAllowed: false}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: out-of-scope}
spec: {statement: "Wat niet beschreven is, is buiten scope."}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: contract-first}
spec: {statement: "Contract first: tussen deelproducten eerst het contract, dan de code. Het schema is onderdeel van het contract. Contracten in OpenAPI."}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: datamodel-first}
spec: {statement: "Datamodel first: binnen een deelproduct eerst het datamodel, dan de code."}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: structure}
spec: {statement: "Opbouw: micro-frontend (Angular), UX-API (Kotlin), backend (Kotlin), datastore", label: Architectuur}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: database}
spec: {statement: "Database: PostgreSQL", label: Architectuur}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: containerization}
spec: {statement: "Containerization", explainAllowed: true}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: docker-compose}
spec: {statement: "Docker-compose"}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: kubernetes}
spec: {statement: "Kubernetes", explainAllowed: true}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: environments}
spec: {statement: "Omgevingen: OTAP"}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: automate-everything}
spec: {statement: "Automate everything", explainAllowed: true}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: single-source-of-truth}
spec: {statement: "Single source of truth", explainAllowed: true}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: everything-as-code}
spec: {statement: "Everything as code", explainAllowed: true}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: declarative}
spec: {statement: "Declarative", explainAllowed: true}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: gitops}
spec: {statement: "GitOps: alles staat in git, en de pipeline rolt uit", explainAllowed: true}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: only-way-to-production}
spec: {statement: "CI/CD – the only way to production, ook bij spoed.", explainAllowed: false}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: bash-script-only}
spec: {statement: "Een bash-script is de enige weg om te bouwen en uit te rollen.", label: Continuous Delivery}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: github-actions}
spec: {statement: "GitHub Actions roept hetzelfde bash-script aan.", label: Continuous Delivery}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: tdd}
spec: {statement: "Test-driven development (TDD).", label: Testen}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: unit-tests}
spec: {statement: "Unittests.", label: Testen}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: integration-tests}
spec: {statement: "Integratietests binnen het deelproduct.", label: Testen}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: end-to-end-tests}
spec: {statement: "End-to-end tests met Playwright.", label: Testen}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: language}
spec: {statement: "Deze bestanden zijn in het Nederlands. Code is Engels: termen en variabelen in het Engels."}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: deployable-unit}
spec: {statement: "Het deelproduct is de eenheid van deployment. Het bestaat uit één of meer containers. De pipeline deployt altijd het hele deelproduct."}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: subproduct-version}
spec: {statement: "Het deelproduct heeft een eigen versie."}
---
apiVersion: fcd/v0
kind: Principle
metadata: {name: stubs}
spec: {statement: "Stubs (zoals voor andere deelproducten) zijn losse containers, niet onderdeel van het deelproduct."}
---
apiVersion: fcd/v0
kind: Explanation
metadata: {name: demo-structure}
spec: {principle: structure, subject: fcd-demo, reason: "demo: frontend en backend"}
---
apiVersion: fcd/v0
kind: Explanation
metadata: {name: demo-database}
spec: {principle: database, subject: fcd-demo, reason: "demo: bestand"}
---
apiVersion: fcd/v0
kind: Explanation
metadata: {name: demo-kubernetes}
spec: {principle: kubernetes, subject: fcd-demo, reason: "demo: docker-compose"}
---
apiVersion: fcd/v0
kind: Explanation
metadata: {name: demo-environments}
spec: {principle: environments, subject: fcd-demo, reason: "demo: één omgeving"}
---
apiVersion: fcd/v0
kind: Explanation
metadata: {name: EXP-001}
spec:
  principle: quality-gate-security
  # fcd-dashboard: D1 (tijdelijk), tot de configuratie van FCD zelf in fcd staat.
  subjects: [sk-bestellen, fcd-dashboard]
  gate: security
  rule: versheid frontend
  reason: "Frontend loopt een major-versie achter (Angular 21 -> 22, TypeScript 5.9 -> 7, vitest 4 -> 5, jsdom 28 -> 31). Bijwerken na de demo (fcd-demo issue #1)."
  approver: Johannes
  approved: 2026-11-20
  until: 2026-12-31
---
apiVersion: fcd/v0
kind: Explanation
metadata: {name: EXP-002}
spec:
  principle: quality-gate-security
  # fcd-dashboard: D1 (tijdelijk), tot de configuratie van FCD zelf in fcd staat.
  subjects: [sk-bestellen, fcd-dashboard]
  gate: security
  rule: versheid backend
  reason: "json-schema-validator loopt een major-versie achter (1.5.9 -> 3.0.9); versie 3 vereist Jackson 3. Bijwerken na de demo (fcd-demo issue #17)."
  approver: Johannes
  approved: 2026-11-20
  until: 2026-12-31
---
apiVersion: fcd/v0
kind: Explanation
metadata: {name: EXP-003}
spec:
  principle: database
  subject: registry
  reason: "Apicurio Registry houdt de contracten voor de demo in het geheugen (H2), niet in PostgreSQL. De contracten staan in git; na een herstart vult de Pipeline het register opnieuw."
  approver: Johannes
  approved: 2026-11-20
  until: 2026-12-31
---
# De pipeline binnen 5 minuten, alleen voor de demo (goedgekeurde afwijking, V8). Alle stappen en gates blijven.
apiVersion: fcd/v0
kind: Explanation
metadata: {name: EXP-004}
spec:
  principle: automate-everything
  subjects: [sk-bestellen]
  step: build
  rule: images opgewarmd
  reason: "Alleen voor de demo: de images zijn vooraf opgewarmd (voorbereiding), zodat de pipeline binnen 5 minuten blijft. Er wordt wel gebouwd."
  approver: Johannes
  approved: 2026-11-21
  until: 2026-12-31
---
apiVersion: fcd/v0
kind: Explanation
metadata: {name: EXP-005}
spec:
  principle: quality-gate-security
  subjects: [sk-bestellen]
  step: security-freshness
  rule: scan uit cache
  reason: "Alleen voor de demo: de security-, versheids- en licentiescan van dezelfde inhoud (repository of image) komt uit de cache van de voorbereiding. Nieuwe inhoud wordt wel gescand."
  approver: Johannes
  approved: 2026-11-21
  until: 2026-12-31
---
apiVersion: fcd/v0
kind: Explanation
metadata: {name: EXP-006}
spec:
  principle: end-to-end-tests
  subjects: [sk-bestellen]
  step: end-to-end-tests
  rule: alleen kernpad
  reason: "Alleen voor de demo: end-to-end alleen het kernpad 'bestelling plaatsen' (@kernpad). De volledige scenario's draaien buiten de demo."
  approver: Johannes
  approved: 2026-11-21
  until: 2026-12-31
---
apiVersion: fcd/v0
kind: Explanation
metadata: {name: EXP-007}
spec:
  principle: only-way-to-production
  subjects: [sk-bestellen]
  step: release
  rule: lokale release
  reason: "Alleen voor de demo: een lokale tag en de changelog, geen GitHub Release; tijdens de demo geen push naar remote (V9)."
  approver: Johannes
  approved: 2026-11-21
  until: 2026-12-31
---
apiVersion: fcd/v0
kind: Explanation
metadata: {name: EXP-008}
spec:
  principle: github-actions
  subjects: [sk-bestellen]
  rule: lokale agent
  reason: "Alleen voor de demo: de Pipeline draait lokaal als agent, zonder GitHub Actions, met hetzelfde bash-script (fcd)."
  approver: Johannes
  approved: 2026-11-22
  until: 2026-12-31
